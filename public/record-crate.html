<style>
/* Layout: bin-divider header, sticky filter bar, one card per Marketplace listing with its records as rows */
:root{
  --bg:#eef0f4; --surface:#ffffff; --fg:#16181f; --muted:#5c6172; --line:#d7dae3;
  --accent:#2a46c9; --accent-soft:#e3e8fb; --want:#c4245b; --want-soft:#fbe3ec; --sold:#8b8f9c;
  --display:"Big Shoulders Display", "Arial Narrow", sans-serif;
  --body:"Familjen Grotesk", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11131a; --surface:#1a1d26; --fg:#eceef4; --muted:#9aa0b2; --line:#2c303d;
  --accent:#8ea2ff; --accent-soft:#232a4a; --want:#ff6f9c; --want-soft:#3a1c28; --sold:#6d7282; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11131a; --surface:#1a1d26; --fg:#eceef4; --muted:#9aa0b2; --line:#2c303d;
  --accent:#8ea2ff; --accent-soft:#232a4a; --want:#ff6f9c; --want-soft:#3a1c28; --sold:#6d7282; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
h1{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;letter-spacing:.01em;margin:0;text-transform:uppercase;text-wrap:balance}
.sub{color:var(--muted);margin:8px 0 0;max-width:60ch}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.stats b{color:var(--fg);font-weight:600}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;margin-top:14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
#q{width:100%;box-sizing:border-box;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
#q:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font:inherit;font-size:13px;font-weight:500;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.want[aria-pressed="true"]{background:var(--want);border-color:var(--want);color:#fff}
.spacer{flex:1}
.copy{font:inherit;font-size:13px;font-weight:600;padding:6px 12px;border-radius:8px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.list{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.lot{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lot-h{display:flex;gap:10px;align-items:baseline;justify-content:space-between;padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.lot-t{font-family:var(--display);font-weight:600;font-size:21px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05;min-width:0}
.lot-p{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;text-align:right}
.lot-p small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--line);color:var(--muted);vertical-align:middle;margin-left:6px}
.rec{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line)}
.rec:first-of-type{border-top:0}
.rec .n{min-width:0}
.rec .a{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.rec .t{font-weight:500}
.rec .t .note{display:block;color:var(--accent);font-weight:500;font-size:12px;margin-top:2px}
.rec .t .u{color:var(--muted);font-weight:400;font-size:12px;margin-left:4px}
.rec .pr{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);min-width:62px;text-align:right}
.rec .pr.set{color:var(--fg);font-weight:600}
.rec.sold .t,.rec.sold .a{color:var(--sold);text-decoration:line-through}
.rec.on{background:var(--want-soft)}
.btn{font:inherit;font-size:13px;font-weight:600;padding:7px 10px;border-radius:8px;border:1px solid var(--want);background:transparent;color:var(--want);cursor:pointer;white-space:nowrap}
.btn[aria-pressed="true"]{background:var(--want);color:#fff}
.btn:disabled{border-color:var(--line);color:var(--sold);cursor:default}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
#out{width:100%;box-sizing:border-box;min-height:120px;font:13px/1.4 var(--body);margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
@media (max-width:480px){.rec{grid-template-columns:1fr auto;}.rec .pr{grid-column:1;grid-row:2;text-align:left;min-width:0}.rec .btn{grid-row:1/3;grid-column:2}h1{font-size:36px}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<div class="wrap">
  <h1>Record Crate</h1>
  <p class="sub">Every LP from the seller's Marketplace listings, grouped by listing. Prices are per record; the listing price is shown on each group. Struck through = already sold. "To confirm" = title read from a small photo.</p>
  <div class="stats" id="stats"></div>

  <div class="bar">
    <input id="q" type="search" placeholder="Search artist or album" autocomplete="off">
    <div class="chips">
      <button class="chip" data-f="all" aria-pressed="true">All</button>
      <button class="chip want" data-f="want" aria-pressed="false">Interested</button>
      <button class="chip" data-f="noprice" aria-pressed="false">No price</button>
      <button class="chip" id="soldT" aria-pressed="false">Show sold</button>
      <span class="spacer"></span>
      <button class="copy" id="copy">Write message to seller</button>
    </div>
    <textarea id="out" hidden readonly aria-label="Message to seller"></textarea>
  </div>

  <div class="list" id="list"></div>
</div>

try{showSold=localStorage.getItem("showSold")==="1"}catch(e){}

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=v=>v==null?"—":"$"+v;

function render(){
  const ql=q.trim().toLowerCase();
  let html="";
  LOTS.forEach((L,i)=>{
    const [title,lp,lotSold]=L;
    const all=recs.filter(r=>r.lot===i);
    const rows=all.filter(r=>{
      if(!showSold && r.sold && !want.has(r.id)) return false;
      if(filter==="want" && !want.has(r.id)) return false;
      if(filter==="noprice" && (r.price!=null || r.sold)) return false;
      if(ql && !(r.artist+" "+r.album+" "+title).toLowerCase().includes(ql)) return false;
      return true;
    });
    if(!rows.length) return;
    const avail=all.filter(r=>!r.sold);
    const sum=avail.reduce((s,r)=>s+(r.price||0),0);
    const priced=avail.length && avail.every(r=>r.price!=null);
    let meta=`${avail.length} available`;
    if(priced && (lp==null || sum!==lp)) meta+=` · records add up to $${sum}`;
    html+=`<section class="lot"><div class="lot-h"><div class="lot-t">${esc(title)}${lotSold?'<span class="tag">Sold</span>':''}</div>
      <div class="lot-p">${lp!=null?"Listed $"+lp:(priced?"$"+sum:"—")}<small>${meta}</small></div></div>`;
    rows.forEach(r=>{
      const on=want.has(r.id);
      html+=`<div class="rec${r.sold?" sold":""}${on?" on":""}"><div class="n"><div class="a">${esc(r.artist)}</div>
        <div class="t">${esc(r.album)}${r.unsure?'<span class="u">to confirm</span>':''}${r.note?`<span class="note">${esc(r.note)}</span>`:''}</div></div>
        <div class="pr${r.price!=null?" set":""}">${r.sold?"":r.price!=null?"$"+r.price:"no price"}</div>
        <button class="btn" data-id="${r.id}" aria-pressed="${on}" ${r.sold&&!on?"disabled":""}>${on?"♥ Interested":r.sold?"Sold":"I'm interested"}</button></div>`;
    });
    html+=`</section>`;
  });
  const emptyMsg={want:"No records marked yet. Tap “I'm interested” on a record to see it here.",noprice:"Every available record has a price.",all:"Nothing found."};
  $("#list").innerHTML=html||`<div class="empty">${emptyMsg[filter]}</div>`;
  const avail=recs.filter(r=>!r.sold);
  const wl=recs.filter(r=>want.has(r.id)), wt=wl.reduce((s,r)=>s+(r.price||0),0);
  $("#stats").innerHTML=`<span><b>${LOTS.length}</b> listings</span><span><b>${avail.length}</b> available LPs</span><span><b>${avail.filter(r=>r.price==null).length}</b> without price</span><span><b>${want.size}</b> interested${want.size?` · <b>$${wt}</b>`:""}</span>`;
  document.querySelectorAll("[data-f]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.f===filter));
  $("#soldT").setAttribute("aria-pressed",showSold);
}

$("#list").addEventListener("click",e=>{
  const b=e.target.closest(".btn"); if(!b||b.disabled) return;
  const id=b.dataset.id; want.has(id)?want.delete(id):want.add(id); save(); render();
});
document.querySelectorAll("[data-f]").forEach(b=>b.addEventListener("click",()=>{filter=b.dataset.f;render()}));
$("#soldT").addEventListener("click",()=>{showSold=!showSold;try{localStorage.setItem("showSold",showSold?"1":"0")}catch(e){};render()});
$("#q").addEventListener("input",e=>{q=e.target.value;render()});

function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),1800)}
$("#copy").addEventListener("click",()=>{
  const list=recs.filter(r=>want.has(r.id));
  if(!list.length){toast("Mark a record first");return}
  const groups={};list.forEach(r=>{(groups[r.lot]=groups[r.lot]||[]).push(r)});
  let body="", total=0, missing=false;
  Object.keys(groups).forEach(i=>{
    const L=LOTS[i];
    body+=`\n${L[0]}:\n`;
    groups[i].forEach(r=>{total+=r.price||0; if(r.price==null) missing=true;
      body+=`- ${r.artist} – ${r.album}${r.note?` (${r.note})`:""}${r.price!=null?` – $${r.price}`:""}\n`});
  });
  const n=list.length;
  const txt=`Hi! I came across your records on Marketplace and I'm interested in ${n===1?"this one":`these ${n}`}:\n${body}\n${n>1?`That comes to $${total}${missing?" plus the ones without a listed price":""} at your asking prices. `:""}What would be the best price you could do for ${n===1?"it":"all of them together"}?\n\nI can pick up whenever works for you. Thanks!`;
  const out=$("#out");out.hidden=false;out.value=txt;out.style.height="auto";out.style.height=Math.min(out.scrollHeight+4,420)+"px";
  const fb=()=>{out.select();toast("Select and copy the text below")};
  try{navigator.clipboard.writeText(txt).then(()=>toast("Message copied")).catch(fb)}catch(e){fb()}
});
render();
</script>

<style>
/* A deterrent only, same rules as the storefront's contentProtection.ts. The search and message fields keep working. */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
img{-webkit-user-drag:none}
@media print{body{display:none}}
</style>
<script>
(()=>{
const DEVTOOLS_KEYS=["KeyI","KeyJ","KeyC","KeyK","KeyE","KeyM","KeyU"],PAGE_KEYS=["KeyU","KeyS","KeyP"],SELECTION_KEYS=["KeyA","KeyC","KeyX","KeyV"];
const isEditable=t=>t instanceof HTMLElement&&t.closest("input,textarea")!==null;
const blocked=e=>{
  if(e.key==="F12")return true;
  if(!e.ctrlKey&&!e.metaKey)return false;
  if((e.shiftKey||e.altKey)&&DEVTOOLS_KEYS.includes(e.code))return true;
  if(PAGE_KEYS.includes(e.code))return true;
  return SELECTION_KEYS.includes(e.code)&&!isEditable(e.target);
};
["contextmenu","copy","cut","paste","drop","dragstart","selectstart"].forEach(n=>document.addEventListener(n,e=>{if(!isEditable(e.target))e.preventDefault()},true));
document.addEventListener("keydown",e=>{if(blocked(e))e.preventDefault()},true);
})();
</script>

</body></html>
