name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

  deploy-photo-identification:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set Gemini secret and deploy identification function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Missing Actions variable SUPABASE_PROJECT_REF" >&2
            exit 1
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "Add SUPABASE_ACCESS_TOKEN and GEMINI_API_KEY under Actions secrets" >&2
            exit 1
          fi
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" "GEMINI_API_KEY=$GEMINI_API_KEY"
          supabase functions deploy identify-records --project-ref "$SUPABASE_PROJECT_REF"